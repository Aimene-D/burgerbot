# Dev machine RViz — connect to the remote robot's ROS 2 graph from Windows.
#
# ── Prerequisites ───────────────────────────────────────────────────────────
#
# 1. Docker Desktop installed with the WSL2 backend.
#
# 2. WSL2 mirrored networking (Windows 11 22H2+ only).
#    Without it, network_mode:host attaches to the WSL2 VM's private subnet
#    instead of your LAN, and DDS cannot reach the robot.
#
#    Enable once — add these lines to %USERPROFILE%\.wslconfig:
#        [wsl2]
#        networkingMode=mirrored
#    Then restart WSL2:
#        wsl --shutdown
#
# 3. VcXsrv — X server for Windows (display for RViz).
#    Docker Desktop containers run inside an isolated WSL2 VM and cannot reach
#    WSLg's display socket directly. VcXsrv runs on Windows and accepts X11
#    connections over TCP, which the container reaches at host.docker.internal.
#
#    a. Download and install VcXsrv: https://vcxsrv.sourceforge.net
#    b. Launch XLaunch (start menu) with these settings:
#         - Multiple windows, display number 0
#         - Start no client
#         - Check "Disable access control"   ← required
#    c. Allow it through the Windows Firewall if prompted.
#    VcXsrv must be running every time you start the container.
#
# 4. Set ROBOT_IP to the robot's LAN address before every run:
#        PowerShell:  $env:ROBOT_IP = "192.168.x.x"
#        cmd.exe:     set ROBOT_IP=192.168.x.x
#
# ── Build (once, or after code changes) ────────────────────────────────────
#   docker compose -f docker/docker-compose.devmachine.yml build
#
# ── Run ─────────────────────────────────────────────────────────────────────
#   $env:ROBOT_IP = "192.168.x.x"
#   docker compose -f docker/docker-compose.devmachine.yml run --rm rviz
#   docker compose -f docker/docker-compose.devmachine.yml run --rm rqt
#
# For Foxglove Studio (native Windows app — no Docker needed):
#   1. Start foxglove on the robot:
#        docker compose -f docker/docker-compose.yml run --rm foxglove
#   2. Open Foxglove Studio → Open Connection → Foxglove WebSocket
#        URL: ws://ROBOT_IP:8765
#
# On the robot, make sure these are running first:
#   docker compose -f docker/docker-compose.yml run --rm bringup
#   docker compose -f docker/docker-compose.yml run --rm slam

x-devbase: &devbase
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: burgerbot:latest
  network_mode: host
  ipc: host
  stdin_open: true
  tty: true
  environment:
    - ROS_DOMAIN_ID=0
    - ROBOT_IP=${ROBOT_IP:?Set ROBOT_IP to the robot LAN IP, e.g. 192.168.1.42}
    - CYCLONEDDS_URI=file:///cyclone_peers.xml
    - DISPLAY=${DISPLAY:-host.docker.internal:0.0}
    - LIBGL_ALWAYS_INDIRECT=0
  volumes:
    - ./cyclone_peers.xml:/cyclone_peers.xml:ro

services:
  rviz:
    <<: *devbase
    container_name: burgerbot_rviz_dev
    command: >
      bash -c "source /ros2_ws/install/setup.bash &&
               ros2 launch burgerbot debug.launch.py"

  # rqt — node graph, topic inspector, TF tree, log console, plots.
  # Same prerequisites as rviz (VcXsrv + ROBOT_IP).
  #   docker compose -f docker/docker-compose.devmachine.yml run --rm rqt
  rqt:
    <<: *devbase
    container_name: burgerbot_rqt_dev
    command: >
      bash -c "source /ros2_ws/install/setup.bash && rqt"
