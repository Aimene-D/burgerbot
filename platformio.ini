; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:adafruit_feather_esp32s3_nopsram]
platform = espressif32
board = adafruit_feather_esp32s3_nopsram
framework = arduino
monitor_speed = 115200
build_unflags =
	-DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
	-DUSE_MICROROS=1
	-DARDUINO_USB_CDC_ON_BOOT=0
	-L.pio/libdeps/${PIOENV}/micro_ros_arduino/src/esp32
	-lmicroros
lib_deps =
	https://github.com/micro-ROS/micro_ros_arduino.git#v2.0.8-jazzy
	https://github.com/adafruit/Adafruit_LSM6DS.git
	adafruit/Adafruit HMC5883 Unified@^1.2.3
	adafruit/Adafruit Unified Sensor@^1.1.15
